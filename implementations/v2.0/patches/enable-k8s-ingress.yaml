# Enables Istio's Kubernetes Ingress support so cert-manager's HTTP-01 ACME solver
# Ingresses (with ingressClassName: istio) are picked up by istio-autogenerated-k8s-ingress
# and routed through the ingressgateway. Required for CA-signed certificates on the
# Kubeflow endpoint managed by the orchestrator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
spec:
  template:
    spec:
      containers:
      - name: discovery
        env:
        - name: PILOT_ENABLE_INGRESS
          value: 'true'
