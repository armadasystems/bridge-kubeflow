apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Vendored from argo-workflows v3.7.3 (see ../vendor/README.md). Kustomize
# fetches remote bases over the network at RENDER time — that fails in an
# air-gapped site, and even online it must complete inside kustomize's
# hardcoded 27s git-fetch timeout, which argo-workflows regularly exceeds.
- ../vendor/base-workflow-controller

patches:
- path: workflow-controller-deployment-patch.yaml
- path: workflow-controller-configmap-patch.yaml

# Allow Kustomize vars to replace fields defined in params.yaml.
# The vars can be defined anywhere.
configurations:
- params.yaml
