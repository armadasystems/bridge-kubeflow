apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Vendored from https://github.com/kubernetes-sigs/jobset/releases/download/v0.11.0/manifests.yaml
  # Kustomize fetches remote resources over the network at RENDER time, which
  # fails in an air-gapped site (ArgoCD cannot reach github.com) and is also a
  # live dependency on a third-party repo for online deploys. The release is
  # pinned to v0.11.0 and never moves, so the vendored copy is byte-identical to
  # what the URL served — rendered output is unchanged for both flows.
  # To refresh: re-download that URL at the new version and update this filename.
  - ./manifests-v0.11.0.yaml

images:
  - name: us-central1-docker.pkg.dev/k8s-staging-images/jobset/jobset
    newName: registry.k8s.io/jobset/jobset
    newTag: v0.11.0

# Add required patches.
patches:
  # Remove namespace from the JobSet release manifests.
  - path: patches/jobset_remove_namespace.yaml
    target:
      group: ""
      version: v1
      kind: Namespace
